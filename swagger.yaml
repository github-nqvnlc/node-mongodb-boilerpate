openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login
      description: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        422:
          description: User Not Registered
        500:
          description: Error

  /api/v1/signup:
    post:
      summary: Signup
      description: Signup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Signup successful
        422:
          description: Email is already registered
        500:
          description: Error
